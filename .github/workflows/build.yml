name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: pytest -q
      - run: python -m centinela --report
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: Centinela
          path: dist/Centinela.exe
